name = "cb-butchers-api"
main = "src/index.js"
compatibility_date = "2026-09-16"
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
TEAM_NAME = "CB Butchers"
ALLOWED_ORIGINS = "http://localhost:3000,http://10.0.1.16:3000,https://curlingcalendar.adamdaliborj.workers.dev,https://curlingbrno.isportsystem.cz"
CUP_STANDINGS_CSV_URL = "https://docs.google.com/spreadsheets/d/17rInHjZsT-sP6QSTcK4YhjQqo44TUzMCG7FjMASHjrY/export?format=csv&gid=116203339"
DIVISION_STANDINGS_URL = "https://vysledky.curling.cz/standings/default?seasonId=6&leagueId=351"
GITHUB_WORKFLOW = "update-calendar.yml"
GITHUB_REF = "main"

[[d1_databases]]
binding = "cb_butchers_calendar"
database_name = "cb-butchers-calendar"
database_id = "1e7c2c4e-edd3-4f79-ad27-20b9c8e602b3"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
