<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>CB Butchers – statistiky</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css?v=20261104-brand1" />
  <link rel="stylesheet" href="stats.css?v=20261104-desktop3" />
</head>
<body>
  <header class="topbar">
    <a class="brand-lockup" href="index.html" aria-label="CB Butchers – kalendář">
      <img class="brand-logo" src="assets/cb-butchers-logo.png" alt="CB Butchers" />
      <div class="brand-copy">
        <p class="eyebrow">Curling team</p>
        <h1>Statistiky zápasů</h1>
      </div>
    </a>
    <div class="top-actions">
      <a class="button secondary button-link" href="index.html">← Kalendář</a>
    </div>
  </header>

  <main class="stats-layout">
    <section class="stats-mobile-title" aria-hidden="true">
      <p class="eyebrow">CB Butchers</p>
      <h1>Statistiky zápasů</h1>
    </section>
    <section id="summary-cards" class="stats-cards" aria-live="polite"></section>

    <section class="panel stats-panel">
      <div class="stats-heading">
        <div>
          <p class="eyebrow">Forma</p>
          <h2>Posledních 5 zápasů</h2>
        </div>
        <div id="form-strip" class="form-strip"></div>
      </div>
    </section>

    <section class="panel stats-panel">
      <div class="stats-heading">
        <div>
          <p class="eyebrow">Soutěže</p>
          <h2>Statistiky podle soutěže</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table class="stats-table">
          <thead><tr><th>Soutěž</th><th>Pořadí</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>+/-</th><th>Úspěšnost</th><th>Výhoda LSD</th></tr></thead>
          <tbody id="competition-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel stats-panel">
      <div class="stats-heading">
        <div>
          <p class="eyebrow">Historie</p>
          <h2>Odehrané zápasy</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table class="stats-table matches-table">
          <thead><tr><th>Datum</th><th>Soupeř</th><th>Soutěž</th><th>Výsledek</th><th>Místo</th></tr></thead>
          <tbody id="matches-body"></tbody>
        </table>
      </div>
    </section>

    <p id="stats-error" class="error stats-error"></p>
  </main>

  <script src="stats.js?v=20261104-desktop3" defer></script>
</body>
</html>
